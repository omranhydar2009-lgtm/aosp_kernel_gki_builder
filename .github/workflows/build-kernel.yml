name: 🏗️ PREBUILT_A15-6.6-MOD
on:
  workflow_dispatch:

jobs:

  PREBUILT_A15_6_6:
    runs-on: ubuntu-latest
    steps:
      - name: "👨‍🔧 Setup build environment"
        run: curl https://raw.githubusercontent.com/akhilnarang/scripts/master/setup/android_build_env.sh | bash -
      
      - name: "⏳ Clone Repo, Sync & Build."
        run: |
          repo init -u https://gitlab.com/xprateek/kernel_manifest -b common-android15-6.6 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle
          cd common
          git fetch --tags
          git checkout android15-6.6-2025-02_r1
          cd ..
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: "📤 Upload Image Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Image-GKI-6.6
          path: out/android15-6.6/dist/Image

  PREBUILT_A15_6_6_KSU:
    runs-on: ubuntu-latest
    steps:
      - name: "👨‍🔧 Setup build environment"
        run: curl https://raw.githubusercontent.com/akhilnarang/scripts/master/setup/android_build_env.sh | bash -
      
      - name: "⏳ Clone Repo, Sync & Build (KSU)."
        run: |
          repo init -u https://gitlab.com/xprateek/kernel_manifest -b common-android15-6.6 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle
          cd common
          git fetch --tags
          git checkout android15-6.6-2025-02_r1
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          cd ..
          tools/bazel build --config=fast //common:kernel_aarch64_dist

      - name: "📤 Upload Image KSU Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Image-GKI-6.6-KSU
          path: out/android15-6.6/dist/Image
